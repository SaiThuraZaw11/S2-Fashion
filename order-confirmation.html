<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed | S2 Fashion</title>
<meta name="description" content="Your S2 Fashion order has been placed successfully.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo">S2 <span>Fashion</span></a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="shop.html">Categories</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-actions">
      <a href="cart.html" class="icon-btn" aria-label="Shopping cart">
        <i class="fa-solid fa-bag-shopping"></i>
        <span class="cart-count">0</span>
      </a>
      <button class="hamburger" aria-label="Open menu"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>

<div class="mobile-nav">
  <button class="mobile-nav-close" aria-label="Close menu">&times;</button>
  <a href="index.html">Home</a>
  <a href="shop.html">Shop</a>
  <a href="about.html">About</a>
  <a href="contact.html">Contact</a>
</div>

<main>
  <div class="container order-confirm" id="order-confirm-root">
    <div class="check"><i class="fa-solid fa-circle-check"></i></div>
    <h1 style="font-size:clamp(1.8rem,3vw,2.4rem);">Order Placed Successfully</h1>
    <p class="mt-4" style="color:var(--color-charcoal);">Thank you — this is a demo order for the S2 Fashion static prototype. No real payment has been processed.</p>
    <div class="order-id-box" id="order-id-box">
      <div class="label">Order Reference</div>
      <div class="value" id="order-id-value">—</div>
    </div>
    <div id="order-details"></div>
    <p class="mt-4"><a href="shop.html" class="btn btn-primary">Continue Shopping</a></p>
  </div>
</main>

<footer class="site-footer">
  <div class="container footer-bottom">
    <span>&copy; 2026 S2 Fashion. All rights reserved.</span>
  </div>
</footer>

<script src="js/products.js"></script>
<script src="js/cart.js"></script>
<script src="js/app.js"></script>
<script>
  // Read the last placed demo order from localStorage and display it.
  document.addEventListener("DOMContentLoaded", () => {
    try {
      const raw = localStorage.getItem("s2fashion_last_order");
      if (!raw) return;
      const order = JSON.parse(raw);
      document.getElementById("order-id-value").textContent = order.orderId;
      const details = document.getElementById("order-details");
      details.innerHTML = `
        <div style="text-align:left;max-width:420px;margin:0 auto;">
          <div class="summary-row"><span>Customer</span><span>${order.customer.fullName}</span></div>
          <div class="summary-row"><span>Payment Method</span><span>${order.paymentMethod}</span></div>
          <div class="summary-row"><span>Items</span><span>${order.items.reduce((s,i)=>s+i.qty,0)}</span></div>
          <div class="summary-row total"><span>Total Paid</span><span>$${order.total.toFixed(2)}</span></div>
        </div>
      `;
    } catch (e) { console.error(e); }
  });
</script>
</body>
</html>
